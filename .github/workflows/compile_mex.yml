name: Compile CAT mex-files

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Number of mex-files expected from the main c-function list in compile.m.
  # Bump this when functions are added to or removed from that list.
  MIN_MEX_FILES: 19

jobs:
  compile_mex:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # On Linux, the OS version should be as old as possible for mex compatibility.
          - os: ubuntu-22.04
            os_name: Linux
            mex_ext: mexa64
            matlab_release: R2020a
            matlab_legacy: true
          # On Mac and Windows, only the Matlab version matters for mex compatibility, so the OS can be the latest.
          - os: macos-15-intel
            os_name: macOS_Intel
            mex_ext: mexmaci64
            matlab_release: R2020a
            matlab_legacy: true
          - os: macos-latest
            os_name: macOS_Apple_Silicon
            mex_ext: mexmaca64
            matlab_release: R2023b
            matlab_legacy: false
          # Pinned to windows-2022 because that image still ships Visual Studio 2022.
          # windows-latest now resolves to windows-2025-vs2026 (VS 2026 only), whose
          # compiler is not supported by R2022a, so every mex call fails there.
          - os: windows-2022
            os_name: Windows
            mex_ext: mexw64
            matlab_release: R2022a
            matlab_legacy: true

    steps:
      - name: Set up MATLAB (legacy)
        if: ${{ matrix.matlab_legacy }}
        uses: matlab-actions/setup-matlab@v1
        with:
          release: ${{ matrix.matlab_release }}
      - name: Set up MATLAB
        if: ${{ !matrix.matlab_legacy }}
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.matlab_release }}

      - name: Checkout SPM
        uses: actions/checkout@v4
        with:
          repository: spm/spm
          path: spm

      - name: Checkout CAT into SPM toolbox
        # Checks out directly into spm/toolbox/CAT — no rsync or cp needed,
        # works on all platforms including Windows.
        uses: actions/checkout@v4
        with:
          path: spm/toolbox/CAT

      - name: Delete old MEX files on Ubuntu and Mac
        if: runner.os != 'Windows'
        run: find spm/toolbox/CAT -type f -name "*.mex*" -delete

      - name: Delete old MEX files on Windows
        if: runner.os == 'Windows'
        run: Get-ChildItem -Path spm\toolbox\CAT -Recurse -Include *.mex* | Remove-Item -Force
  
      - name: Install rsync on Windows
        if: runner.os == 'Windows'
        run: choco install -y rsync
        shell: bash

      - name: Install CAT in SPM toolbox
        shell: bash
        run: |
          mkdir -p spm/toolbox/CAT
          rsync -a --exclude='.git' \
            --exclude='spm/toolbox/CAT/' \
            --exclude='batches/' \
            --exclude='catQC/' \
            --exclude='check_pipeline/' \
            --exclude='development/' \
            --exclude='html/' \
            --exclude='internal/' \
            --exclude='mexmaca/' \
            --exclude='mexmaci/' \
            --exclude='spm/' \
            --exclude='Makefile' \
            ./ spm/toolbox/CAT/

      - name: Compile CAT mex-files (legacy)
        if: ${{ matrix.matlab_legacy }}
        uses: matlab-actions/run-command@v1
        with:
          command: |
            ws = getenv('GITHUB_WORKSPACE');
            addpath(fullfile(ws, 'spm'));
            cd(fullfile(ws, 'spm', 'toolbox', 'CAT'))
            compile(1,0)

      - name: Compile CAT mex-files
        if: ${{ !matrix.matlab_legacy }}
        uses: matlab-actions/run-command@v2
        with:
          command: |
            ws = getenv('GITHUB_WORKSPACE');
            addpath(fullfile(ws, 'spm'));
            cd(fullfile(ws, 'spm', 'toolbox', 'CAT'))
            compile(1,0)

      # compile.m catches every mex error internally and always returns
      # successfully, so a broken toolchain would otherwise be noticed only by
      # the size of the uploaded (empty) zip.
      - name: Verify mex-files were built
        shell: bash
        run: |
          mex_files=$(find spm/toolbox/CAT -maxdepth 1 -type f -name "*.${{ matrix.mex_ext }}" | sort)
          n=$(printf '%s\n' "$mex_files" | grep -c . || true)
          echo "Built $n ${{ matrix.mex_ext }} file(s):"
          printf '%s\n' "$mex_files"
          if [ "$n" -lt "$MIN_MEX_FILES" ]; then
            echo "::error::Only $n of the expected $MIN_MEX_FILES ${{ matrix.mex_ext }} files were built - check the compile step for mex errors."
            exit 1
          fi

      # A mex-file inherits the glibc symbol versions of the machine it was built
      # on, and the loader treats them as a hard minimum: built against the
      # runner's glibc, it is refused by MATLAB on every older system with
      # "version `GLIBC_2.34' not found" -- RHEL/Rocky 8, Ubuntu 20.04, Debian
      # 10/11. Nothing on the build machine notices, which is why this is checked
      # rather than assumed. cat_glibc_compat.h pins the symbols that would
      # otherwise raise the floor, and the floor below is what is left once it has
      # done its work. A source that starts calling exp/log/pow or the pthread
      # functions without including that header shows up here.
      #
      # Raise the floor only deliberately: it is the oldest Linux CAT still runs
      # on. The fix for a failure is normally the missing include, not a new floor.
      - name: Check the glibc floor of the mex-files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          max_allowed=2.14
          echo "builder: $(ldd --version | head -1)"
          status=0
          for f in $(find spm/toolbox/CAT -type f -name "*.mexa64" | sort); do
            imports=$(objdump -T "$f" |
                      sed -nE 's/.*\(GLIBC_([0-9][0-9.]*)\)[[:space:]]+([A-Za-z_][A-Za-z0-9_]*)$/\1 \2/p' |
                      sort -uV)
            highest=$(printf '%s\n' "$imports" | tail -n1 | cut -d' ' -f1)
            if [ "$(printf '%s\n%s\n' "$max_allowed" "$highest" | sort -V | tail -n1)" = "$max_allowed" ]; then
              echo "ok: $(basename "$f") needs at most GLIBC_$highest"
            else
              echo "::error::$(basename "$f") needs GLIBC_$highest, above the GLIBC_$max_allowed floor"
              printf '%s\n' "$imports" | sed 's/^/    GLIBC_/'
              status=1
            fi
          done

          # The C++ mex-files carry a second, independent floor: libstdc++. MATLAB
          # preloads its own, which is usually older than the runner's, so a high
          # GLIBCXX requirement fails inside MATLAB itself rather than only on old
          # distributions. Reported, not gated -- the sources need only the base
          # GLIBCXX_3.4 today, and a threshold here would be a guess.
          for f in $(find spm/toolbox/CAT -type f -name "*.mexa64" | sort); do
            cxx=$(objdump -T "$f" | grep -oE '(GLIBCXX|CXXABI)_[0-9.]+' | sort -uV | tr '\n' ' ')
            [ -n "$cxx" ] && echo "c++ abi: $(basename "$f") needs $cxx"
          done
          exit $status

      - name: Install zip on Windows
        if: runner.os == 'Windows'
        run: choco install zip -y
        shell: bash

      - name: Zip mex-files
        run: |
          cd spm/toolbox/
          zip -r ../../cat_${{ github.ref_name }}_${{ matrix.mex_ext }}.zip . -i CAT/*.${{ matrix.mex_ext }}

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cat_${{ github.ref_name }}_${{ matrix.mex_ext }}
          path: cat_*.zip
          if-no-files-found: error
